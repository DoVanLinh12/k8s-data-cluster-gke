ingress:
  enabled: false

executor: "KubernetesExecutor"

serviceAccount:
  create: true
  name: airflow-worker

data:
  metadataConnection:
    user: postgres
    pass: postgres
    protocol: postgresql
    host: airflow-postgresql.orchestration.svc.cluster.local
    port: 5432
    db: airflow

postgresql:
  enabled: true
  auth:
    username: postgres
    password: postgres
  primary:
    persistence:
      enabled: true
      existingClaim: pvc-airflow-postgres
      size: 8Gi

defaultAirflowRepository: ghostwood/airflow
defaultAirflowTag: "2.0.3"
airflowVersion: "2.10.3"

config:
  core:
    executor: KubernetesExecutor
    dags_are_paused_at_creation: "True"
    load_examples: "False"

  kubernetes:
    namespace: orchestration

  kubernetes_executor:
    namespace: orchestration
    deleteWorkerPods: "True"

  logging:
    remoteLogging: true
    remoteLogConnId: minio_conn
    remoteBaseLogFolder: s3a://airflow-logs
    encryptS3Logs: false

uid: 5000
gid: 0

dags:
  persistence:
    enabled: true
    existingClaim: pvc-airflow-shared
    subPath: "dags"
    size: 2Gi

logs:
  persistence:
    enabled: true
    existingClaim: pvc-airflow-shared
    subPath: "logs"
    size: 2Gi

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"

worker:
  persistence:
    enabled: false

triggerer:
  enabled: true
  persistence:
    enabled: false

redis:
  enabled: false

createUserJob:
  useHelmHooks: false

migrateDatabaseJob:
  useHelmHooks: false